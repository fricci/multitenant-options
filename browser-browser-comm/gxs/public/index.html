<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GXS collections console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23b45309'/><text x='16' y='21' font-family='system-ui' font-size='13' font-weight='700' fill='white' text-anchor='middle'>GS</text></svg>">
  <link rel="stylesheet" href="/app.css">
</head>
<body data-tenant="gxs" data-view="search">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M3.5 17.5a9 9 0 1 1 17 0"/><path d="M12 17l4.2-5.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M17.5 8.5l-6.8 6.8a2.4 2.4 0 0 0 3.4 3.4l7-7a5 5 0 0 0-7-7l-7.4 7.4a7.4 7.4 0 0 0 10.4 10.4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 15.5V10a6 6 0 1 0-12 0v5.5L4.5 18h15z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c1.4-3.8 11.6-3.8 13 0"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4V15a3 3 0 0 0 3 3h6.6"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M19.5 14.5V18a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 18V8A2.5 2.5 0 0 1 7 5.5h3.5"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h12M4 12h8M4 17h5"/><path d="M18.5 9.5v9M15.5 15.5l3 3 3-3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-11.2A7 7 0 1 0 5 9.8C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.4"/><path d="M3 11h18"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v9M9.5 10h5M9.5 14h5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3H9l2 5-2.2 1.6a11.5 11.5 0 0 0 5.6 5.6L16 13l5 2v3.2A2.3 2.3 0 0 1 18.5 20.5A16.5 16.5 0 0 1 3.5 5.5A2.3 2.3 0 0 1 6.5 3z"/></symbol>
  </svg>

  <div class="shell">
    <aside class="rail">
      <div class="brand-mark">GS</div>
      <button type="button" class="rail-btn on" data-action="dashboard" title="CC dashboard">
        <svg class="ic"><use href="#i-gauge"></use></svg>
      </button>
      <button type="button" class="rail-btn" data-action="dashboard" title="Find customer">
        <svg class="ic"><use href="#i-search"></use></svg>
      </button>
      <button type="button" class="rail-btn" title="Documents">
        <svg class="ic"><use href="#i-clip"></use></svg>
      </button>
      <div class="rail-sep"></div>
      <button type="button" class="rail-btn" title="Call task list">
        <svg class="ic"><use href="#i-list"></use></svg>
      </button>
      <div class="rail-sep"></div>
      <button type="button" id="notifications-btn" class="rail-btn" title="Enable incoming call notifications" aria-label="Enable incoming call notifications" aria-pressed="false">
        <svg class="ic"><use href="#i-bell"></use></svg>
      </button>
      <div class="rail-user">
        <div class="avatar">CC</div>
        <div class="rail-user-name">ccoperator1</div>
        <div class="rail-clock" id="clock">30:00</div>
      </div>
    </aside>

    <aside class="subnav">
      <button type="button" class="nav-item on">
        <svg class="ic sm"><use href="#i-user"></use></svg> Customer 360
      </button>
      <button type="button" class="nav-sub">Willingness</button>
      <button type="button" class="nav-sub">Affordability</button>
      <button type="button" class="nav-sub">Risk</button>
      <button type="button" class="nav-sub">Upcoming payments</button>
      <div class="nav-sep"></div>
      <button type="button" class="nav-item">
        <svg class="ic sm"><use href="#i-phone"></use></svg> Contacts
      </button>
      <button type="button" class="nav-item">
        <svg class="ic sm"><use href="#i-calendar"></use></svg> Calendar
      </button>
      <button type="button" class="nav-item">
        <svg class="ic sm"><use href="#i-flow"></use></svg> Workflows
      </button>
    </aside>

    <div class="workspace">
      <header class="page-head">
        <div class="page-title">
          <svg class="ic"><use href="#i-user"></use></svg>
          <span id="page-title">CC dashboard</span>
        </div>
        <div class="head-right">
          <button type="button" id="back-btn" class="btn-ghost only-customer" data-action="dashboard">
            <svg class="ic sm"><use href="#i-gauge"></use></svg> CC dashboard
          </button>
          <a class="link-admin" href="/admin" target="_blank" rel="noopener">Admin</a>
          <div id="status" class="pill">connecting…</div>
        </div>
      </header>

      <section id="search-page">
        <div class="dash-grid">
          <section class="card">
            <h2 class="card-title">Find customer</h2>
            <form id="search-form">
              <div class="search-head">
                <label class="field-hint" for="q">Call task ID / Customer's name, ID, city or product</label>
                <div class="scope-switch" id="scope-switch" role="group" aria-label="Search scope">
                  <button type="button" class="scope-opt on" data-scope="all" aria-pressed="true">All tenants</button>
                  <button type="button" class="scope-opt" data-scope="local" aria-pressed="false">This tenant</button>
                </div>
              </div>
              <div class="search-row">
                <input id="q" type="search" autocomplete="off" placeholder="overdue, Manila, PH-30001…">
                <button type="submit" class="btn-search">Search</button>
              </div>
            </form>
            <p id="meta" class="meta"></p>
            <div class="task-panel">
              <div class="task-panel-title" id="count">Customer call task list</div>
              <div id="results"></div>
            </div>
          </section>

          <section class="card">
            <h2 class="card-title">Current and upcoming tasks <span class="spacer"></span>
              <button type="button" class="icon-btn" title="Sort tasks">
                <svg class="ic"><use href="#i-sort"></use></svg>
              </button>
            </h2>
            <div class="empty-panel">There is no task to display</div>
          </section>
        </div>
      </section>

      <section id="customer-page" class="hidden">
        <div class="c360" id="customer-card"></div>
      </section>
    </div>
  </div>

  <div id="remote-call-modal" class="remote-call-modal hidden" role="dialog" aria-modal="true" aria-labelledby="remote-call-title">
    <div class="remote-call-panel">
      <h2 id="remote-call-title">Call in progress</h2>
      <p id="remote-call-tenant"></p>
      <p id="remote-call-at"></p>
      <p id="remote-call-ago" class="remote-call-ago"></p>
      <button type="button" id="remote-call-close">Close</button>
    </div>
  </div>
  <iframe id="intercom" style="display:none" title="intercom"></iframe>
  <script>
    const APP = {
      id: "gxs",
      name: "GXS",
      locale: "en-PH",
      currency: "PHP",
      country: "Philippines"
    };
  </script>
  <script src="/ui.js"></script>
  <script>
    const HUB_ORIGIN = "http://proxy.localtest.me:3010";
    const iframe = document.getElementById("intercom");
    const input = document.getElementById("q");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const countEl = document.getElementById("count");
    const form = document.getElementById("search-form");
    const searchPage = document.getElementById("search-page");
    const customerPage = document.getElementById("customer-page");
    const customerCard = document.getElementById("customer-card");
    const pageTitle = document.getElementById("page-title");
    const remoteCallModal = document.getElementById("remote-call-modal");
    const remoteCallTenant = document.getElementById("remote-call-tenant");
    const remoteCallAt = document.getElementById("remote-call-at");
    const remoteCallAgo = document.getElementById("remote-call-ago");
    const remoteCallClose = document.getElementById("remote-call-close");
    const notificationsButton = document.getElementById("notifications-btn");
    const scopeSwitch = document.getElementById("scope-switch");

    const DASH_TITLE = "CC dashboard";
    const SCOPE_KEY = `${APP.id}:search-scope`;
    const clock = UI.clock(document.getElementById("clock"));

    const POLL_MS = 1000;

    let RECORDS = [];
    let lastCallId = 0;
    let channelOk = true;
    let hubReady = false;
    let pendingQuery = null;
    let pendingIncomingCall = null;
    let debounceTimer = null;
    let originalTitle = document.title;
    let flashInterval = null;
    let ringing = false;
    let dismissedRemoteCallKey = null;
    let remoteCallTimer = null;
    let currentRemoteCall = null;
    let activeCallNotification = null;
    let notificationStatusTimer = null;
    let searchScope = readStoredScope();

    function readStoredScope() {
      try {
        return localStorage.getItem(SCOPE_KEY) === "local" ? "local" : "all";
      } catch {
        return "all";
      }
    }

    function renderScopeSwitch() {
      scopeSwitch.querySelectorAll(".scope-opt").forEach((button) => {
        const on = button.dataset.scope === searchScope;
        button.classList.toggle("on", on);
        button.setAttribute("aria-pressed", String(on));
      });
    }

    function setScope(next) {
      if (next !== "all" && next !== "local") return;
      if (next === searchScope) return;
      searchScope = next;
      try {
        localStorage.setItem(SCOPE_KEY, next);
      } catch {
        /* the switch still works for this tab */
      }
      renderScopeSwitch();
      runSearch(input.value, { broadcast: true, from: APP.id });
    }

    function renderStatus() {
      if (notificationStatusTimer) return;
      const label = hubReady ? "intercom connected" : "connecting…";
      statusEl.textContent = channelOk ? label : `${label} · call channel offline`;
      statusEl.classList.toggle("ok", hubReady && channelOk);
    }

    function setConnected(ok) {
      hubReady = ok;
      renderStatus();
      if (ok && pendingQuery !== null) {
        broadcastSearch(pendingQuery);
        pendingQuery = null;
      }
      if (ok && pendingIncomingCall) {
        iframe.contentWindow.postMessage(pendingIncomingCall, HUB_ORIGIN);
        pendingIncomingCall = null;
      }
    }

    function pingHub() {
      if (!iframe.contentWindow) return;
      iframe.contentWindow.postMessage({ type: "hello", from: APP.id }, HUB_ORIGIN);
    }

    function broadcastSearch(query) {
      if (!hubReady || !iframe.contentWindow) {
        pendingQuery = query;
        return;
      }
      iframe.contentWindow.postMessage(
        { type: "search", query, from: APP.id },
        HUB_ORIGIN
      );
    }

    function broadcastIncomingCall(call) {
      const payload = {
        type: "incoming-call",
        from: APP.id,
        at: String(call.at || new Date().toISOString()),
        callId: Number(call.id) || 0
      };
      if (!hubReady || !iframe.contentWindow) {
        pendingIncomingCall = payload;
        return;
      }
      iframe.contentWindow.postMessage(payload, HUB_ORIGIN);
    }

    function remoteCallKey(from, callId) {
      return `${from}:${callId}`;
    }

    function formatRemoteAt(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return String(iso || "");
      return date.toLocaleString();
    }

    function plural(value, noun) {
      return `${value} ${noun}${value === 1 ? "" : "s"}`;
    }

    function formatCallAge(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      const secs = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
      if (secs < 60) return `${plural(secs, "second")} ago`;
      const mins = Math.floor(secs / 60);
      const rest = secs % 60;
      if (!rest) return `${plural(mins, "minute")} ago`;
      return `${plural(mins, "minute")} ${plural(rest, "second")} ago`;
    }

    function stopRemoteCallTimer() {
      if (remoteCallTimer) {
        clearInterval(remoteCallTimer);
        remoteCallTimer = null;
      }
    }

    function hideRemoteCallModal() {
      remoteCallModal.classList.add("hidden");
      stopRemoteCallTimer();
    }

    function showRemoteCallModal(data) {
      const from = String(data.from || "");
      const callId = Number(data.callId) || 0;
      const at = String(data.at || "");
      if (!from || from === APP.id) return;
      const key = remoteCallKey(from, callId);
      if (key === dismissedRemoteCallKey) return;

      currentRemoteCall = { from, callId, at };
      remoteCallTenant.textContent = `Tenant: ${UI.tenantName(from)}`;
      remoteCallAt.textContent = `Incoming at ${formatRemoteAt(at)}`;
      remoteCallAgo.textContent = formatCallAge(at);
      remoteCallModal.classList.remove("hidden");
      stopRemoteCallTimer();
      remoteCallTimer = setInterval(() => {
        if (!currentRemoteCall) return;
        remoteCallAgo.textContent = formatCallAge(currentRemoteCall.at);
      }, 1000);
    }

    function dismissRemoteCallModal() {
      if (currentRemoteCall) {
        dismissedRemoteCallKey = remoteCallKey(currentRemoteCall.from, currentRemoteCall.callId);
      }
      currentRemoteCall = null;
      hideRemoteCallModal();
    }

    function searchRecords(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return RECORDS.filter((row) =>
        Object.values(row).some((value) => String(value).toLowerCase().includes(q))
      );
    }

    function render(results, query, from) {
      const trimmed = query.trim();
      if (!trimmed) {
        metaEl.textContent = "";
        countEl.textContent = "Customer call task list";
        resultsEl.innerHTML = '<p class="empty">Search a call task ID, name, ID, city or product to build the task list.</p>';
        return;
      }

      const who = from === APP.id ? "You" : UI.tenantName(from);
      const scopeNote = from === APP.id && searchScope === "local" ? ` in ${APP.name} only` : "";
      metaEl.textContent = `${who} searched “${trimmed}”${scopeNote}`;
      countEl.textContent = `Customer call task list (${results.length})`;

      if (!results.length) {
        resultsEl.innerHTML = '<p class="empty">No matching call tasks in this tenant.</p>';
        return;
      }

      resultsEl.innerHTML = UI.taskCards(results, "Open Customer 360");
    }

    function isUnfocused() {
      return document.hidden || !document.hasFocus();
    }

    function updateNotificationButton() {
      const supported = "Notification" in window;
      const permission = supported ? Notification.permission : "unsupported";
      const enabled = permission === "granted";
      let label = "Enable incoming call notifications";
      if (!supported) label = "Native notifications are not supported";
      else if (enabled) label = "Incoming call notifications enabled";
      else if (permission === "denied") {
        label = window.isSecureContext
          ? "Incoming call notifications are blocked in browser settings"
          : "Incoming call notifications need a secure context — see the README for the Chrome insecure-origin flag";
      }
      notificationsButton.title = label;
      notificationsButton.setAttribute("aria-label", label);
      notificationsButton.setAttribute("aria-pressed", String(enabled));
      notificationsButton.classList.toggle("on", enabled);
    }

    function flashNotificationStatus(message) {
      clearTimeout(notificationStatusTimer);
      statusEl.textContent = message;
      statusEl.classList.remove("ok");
      notificationStatusTimer = setTimeout(() => {
        notificationStatusTimer = null;
        renderStatus();
      }, 5000);
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        flashNotificationStatus(
          window.isSecureContext
            ? "notifications unsupported in this browser"
            : "notifications need a secure context · see README for the Chrome flag"
        );
        return;
      }
      let permission = Notification.permission;
      if (permission !== "granted") {
        try {
          permission = await Notification.requestPermission();
        } catch {
          permission = Notification.permission;
        }
      }
      updateNotificationButton();
      if (permission === "granted") flashNotificationStatus("call notifications on");
      else if (permission === "denied") {
        flashNotificationStatus(
          window.isSecureContext
            ? "call notifications blocked · allow them in browser and OS settings"
            : "call notifications need a secure context · see README for the Chrome flag"
        );
      }
      else flashNotificationStatus("notification prompt dismissed");
    }

    function closeIncomingCallNotification() {
      if (!activeCallNotification) return;
      activeCallNotification.close();
      activeCallNotification = null;
    }

    function notifyIncomingCall(call, row) {
      if (!isUnfocused() || !("Notification" in window) || Notification.permission !== "granted") return;
      closeIncomingCallNotification();
      const account = String(row.account || "");
      try {
        const notification = new Notification(`Incoming call · ${APP.name}`, {
          body: account ? `${row.name} · ${account}` : String(row.name || "Unknown customer"),
          tag: `${APP.id}-incoming-call-${Number(call.id) || 0}`
        });
        activeCallNotification = notification;
        notification.onclick = () => {
          window.focus();
          notification.close();
          if (activeCallNotification === notification) activeCallNotification = null;
        };
        notification.onclose = () => {
          if (activeCallNotification === notification) activeCallNotification = null;
        };
      } catch {
        /* keep the in-page incoming-call alert as the fallback */
      }
    }

    function startFlashing(frames) {
      stopFlashing();
      let frame = 0;
      document.title = frames[0];
      flashInterval = setInterval(() => {
        frame = 1 - frame;
        document.title = frames[frame];
      }, 500);
    }

    function stopFlashing() {
      if (flashInterval) {
        clearInterval(flashInterval);
        flashInterval = null;
      }
      document.title = originalTitle;
    }

    function updateFlash(results) {
      if (ringing) return;
      if (results.length > 0 && isUnfocused()) {
        const noun = results.length === 1 ? "task" : "tasks";
        startFlashing([`🔴 ${results.length} ${noun} 🔴`, `🔔 ${results.length} ${noun} 🔔`]);
      } else {
        stopFlashing();
      }
    }

    function clearCall() {
      fetch("/api/clear-call", { method: "POST" }).catch(() => {
        /* the next poll re-syncs */
      });
    }

    function startCallFlash(row) {
      ringing = true;
      document.body.classList.add("ringing");
      clock.startCall();
      startFlashing(["🔴 Incoming call", `📞 ${row.name}`]);
    }

    function acknowledgeCall() {
      if (!ringing) return;
      ringing = false;
      document.body.classList.remove("ringing");
      stopFlashing();
      closeIncomingCallNotification();
      clearCall();
    }

    function showSearch() {
      document.body.dataset.view = "search";
      pageTitle.textContent = DASH_TITLE;
      searchPage.classList.remove("hidden");
      customerPage.classList.add("hidden");
      acknowledgeCall();
      clock.endCall();
    }

    function openCustomer(row, { incoming } = { incoming: false }) {
      document.body.dataset.view = "customer";
      pageTitle.textContent = UI.headline(row);
      searchPage.classList.add("hidden");
      customerPage.classList.remove("hidden");
      customerCard.innerHTML = UI.customer360(row);
      if (incoming) {
        startCallFlash(row);
      } else {
        acknowledgeCall();
      }
    }

    function runSearch(query, { broadcast, from }) {
      showSearch();
      const results = searchRecords(query);
      render(results, query, from);
      if (broadcast && searchScope === "all") {
        broadcastSearch(query);
        dismissRemoteCallModal();
      }
      updateFlash(results);
    }

    function handleIncomingCall(payload) {
      const customer = payload && payload.customer;
      if (!customer || !customer.account) return;
      const row = RECORDS.find((item) => item.account === customer.account) || customer;
      dismissRemoteCallModal();
      openCustomer(row, { incoming: true });
      notifyIncomingCall(payload, row);
      broadcastIncomingCall(payload);
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== HUB_ORIGIN) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "ready") {
        setConnected(true);
        return;
      }
      if (data.type === "search") {
        if (data.from === APP.id) return;
        dismissRemoteCallModal();
        input.value = data.query;
        runSearch(data.query, { broadcast: false, from: data.from });
        return;
      }
      if (data.type === "incoming-call") {
        showRemoteCallModal(data);
      }
    });

    iframe.addEventListener("load", pingHub);
    iframe.src = HUB_ORIGIN + "/";

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (ringing) acknowledgeCall();
      else stopFlashing();
    });

    window.addEventListener("focus", () => {
      updateNotificationButton();
      if (ringing) acknowledgeCall();
      else stopFlashing();
    });

    window.addEventListener("pointerdown", acknowledgeCall);
    window.addEventListener("keydown", acknowledgeCall);

    remoteCallClose.addEventListener("click", dismissRemoteCallModal);
    notificationsButton.addEventListener("click", enableNotifications);
    updateNotificationButton();

    scopeSwitch.querySelector('[data-scope="local"]').textContent = `${APP.name} only`;
    scopeSwitch.addEventListener("click", (event) => {
      const option = event.target.closest(".scope-opt");
      if (option) setScope(option.dataset.scope);
    });
    renderScopeSwitch();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      clearTimeout(debounceTimer);
      runSearch(input.value, { broadcast: true, from: APP.id });
    });

    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        runSearch(input.value, { broadcast: true, from: APP.id });
      }, 300);
    });

    resultsEl.addEventListener("click", (event) => {
      const card = event.target.closest("[data-account]");
      if (!card) return;
      const row = RECORDS.find((item) => item.account === card.dataset.account);
      if (row) openCustomer(row, { incoming: false });
    });

    document.querySelectorAll('[data-action="dashboard"]').forEach((element) => {
      element.addEventListener("click", () => {
        showSearch();
        render(searchRecords(input.value), input.value, APP.id);
      });
    });

    async function pollCurrentCall() {
      try {
        const res = await fetch("/api/current-call", { cache: "no-store" });
        const body = await res.json();
        const call = body && body.call;
        channelOk = true;
        renderStatus();
        if (call && call.id > lastCallId) {
          lastCallId = call.id;
          handleIncomingCall(call);
        } else if (!call && ringing) {
          ringing = false;
          document.body.classList.remove("ringing");
          stopFlashing();
          closeIncomingCallNotification();
        }
      } catch {
        channelOk = false;
        renderStatus();
      }
    }

    fetch("/api/customers")
      .then((res) => res.json())
      .then((rows) => {
        RECORDS = Array.isArray(rows) ? rows : [];
      })
      .catch(() => {
        /* search stays empty; the customer detail view still works from the call payload */
      })
      .finally(() => {
        render([], "", APP.id);
        pollCurrentCall();
        setInterval(pollCurrentCall, POLL_MS);
      });
  </script>
</body>
</html>
