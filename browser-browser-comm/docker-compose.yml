services:
  sgmy:
    build: ./sgmy
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    volumes:
      - ./sgmy/public:/app/public:ro

  gxb:
    build: ./gxb
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
    volumes:
      - ./gxb/public:/app/public:ro

  gxs:
    build: ./gxs
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
    volumes:
      - ./gxs/public:/app/public:ro

  proxy:
    build: ./proxy
    ports:
      - "3010:80"
